<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
       body {
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212; /* Dark background */
}

.login-container {
    background: linear-gradient(145deg, #1e1e1e, #2c2c2c); /* Subtle gradient */
    padding: 30px;
    border-radius: 12px; /* More rounded corners */
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); /* Deeper shadow */
    width: 350px;
}

.login-form {
    display: flex;
    flex-direction: column;
}

.login-form h2 {
    text-align: center;
    color: #e0e0e0; /* Light text */
    margin-bottom: 20px;
    font-weight: 500; /* Slightly bolder */
}

.input-group {
    margin-bottom: 20px; /* Increased spacing */
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    color: #e0e0e0; /* Light text */
}

.input-wrapper {
    position: relative;
}

.input-wrapper input {
    width: 100%;
    padding: 10px;
    border: 1px solid #444; /* Darker border */
    border-radius: 4px;
    background-color: #2c2c2c; /* Dark input background */
    color: #e0e0e0; /* Light text */
}

.input-wrapper input::placeholder {
    color: #888; /* Subtle placeholder */
}

.input-wrapper input:focus {
    border-color: #bb86fc; /* Highlight color */
    box-shadow: 0 0 5px #bb86fc; /* Glow effect */
    outline: none;
}

.input-icon, .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #e0e0e0; /* Matches text color */
}

.forgot-password-section {
    text-align: right;
    margin-bottom: 15px;
}

.forgot-password {
    color: #bb86fc; /* Light purple */
    text-decoration: none;
    font-size: 0.9em;
}

.forgot-password:hover {
    text-decoration: underline;
}

.refresh-btn {
    background: none;
    border: none;
    font-size: 1.5em;
    cursor: pointer;
    transition: transform 0.3s ease;
    color: #e0e0e0;
}

.refresh-btn:hover {
    transform: rotate(180deg);
}

.login-btn {
    background-color: #6200ea; /* Deep purple */
    color: white;
    border: none;
    padding: 10px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.5;
    transition: background-color 0.3s ease;
}

.login-btn:enabled {
    opacity: 1;
    cursor: pointer;
}

.login-btn:hover:enabled {
    background-color: #3700b3; /* Darker purple */
}

.signup-section {
    margin-top: 15px;
    text-align: center;
}

.signup-section p {
    color: #e0e0e0; /* Light text */
    margin-bottom: 10px;
}

.signup-btn {
    background-color: #03dac6; /* Teal */
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.signup-btn:hover {
    background-color: #018786; /* Darker teal */
}

.skip-login-section {
    text-align: center;
    margin-top: 15px;
}

.skip-login-section p {
    color: #bb86fc; /* Adjusted for theme */
    margin-bottom: 10px;
}

.skip-login-btn {
    width: 50%;
    padding: 10px;
    background-color: #436aeb; /* Kept original blue */
    color: #ffffff; /* White text for contrast */
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.skip-login-btn:hover {
    background-color: #00b7eb; /* Lighter blue */
}

.reset-container {
    background-color: #1e1e1e; /* Dark background */
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    width: 350px; /* Matches login container */
}

.reset-step {
    display: none;
}

.reset-step.active {
    display: block;
}

.reset-step h2 {
    color: #e0e0e0; /* Consistent with login form */
    text-align: center;
}

.reset-step label {
    color: #e0e0e0;
}

#resetEmail {
    width: 100%;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 4px;
    background-color: #2c2c2c;
    color: #e0e0e0;
}

#resetEmail:focus {
    border-color: #bb86fc;
    box-shadow: 0 0 5px #bb86fc;
    outline: none;
}

.btn-primary {
    width: 100%;
    padding: 10px;
    background-color: #6200ea; /* Matches login button */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.btn-primary:hover {
    background-color: #3700b3;
}

.back-to-login, .resend-otp {
    text-align: center;
    margin-top: 15px;
}

.back-to-login a, .resend-otp a {
    color: #bb86fc; /* Matches forgot-password */
    text-decoration: none;
    transition: color 0.3s ease;
}

.back-to-login a:hover, .resend-otp a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="login-container">
        <form id="loginForm" class="login-form"  method="POST" action="login.php">
            <h2>User Login</h2>
            <div class="input-group">
                <label for="mobileNumber">Mobile Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="mobileNumber" name="mobile" 
                           required pattern="[0-9]{10}" 
                           placeholder="Enter 10-digit mobile number"
                           maxlength="10">
                    <span class="input-icon">📱</span>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper password-input">
                    <input type="password" id="password" name="pass" 
                           required minlength="8"
                           required placeholder="Enter your password">
                    <span class="password-toggle">👁️</span>
                </div>
            </div>
            <div class="forgot-password-section">
                <a href="#" id="forgetPasswordLink" class="forgot-password forgot-password-trigger" onclick="document.getElementById('forget-password-container').style.display='block'; return false;">Forgot Password?</a>
            </div>


            <input type="submit" value="Submit" name="sb" class="login-btn" id="loginButton" 
                   onclick="return (document.getElementById('mobileNumber').value && document.getElementById('password').value) ? true : (alert('Please fill in both mobile number and password'), false)" >

            <div class="or">
            <div class="signup-section">
                <p>New user?</p>
                <a href="registration.html" type="button" class="signup-btn" id="signupButton" style="text-decoration:none;">Sign Up</a>
            </div>
            </div>
            </div>
        </form>
    </div>

    <div id="forget-password-container" class="reset-container" style="display:none;">
        <!-- Email Verification Step -->
        <div id="emailVerificationStep" class="reset-step active">
            <form id="emailVerificationForm" method="POST" action="forgotpassword.php">
                <h2>Forgot Password</h2>
                <br>
                <br>
                <div class="input-group">
                    <label for="resetEmail">Enter Your Email</label>
                    <input type="email" id="resetEmail" required name="email" style="width: 100%; height: 35px; border-radius: 5px;">
                 </div>
                 <br>
                 <br>
                <input type="submit" value="Send OTP" class="btn-primary" name="send-reset-link">
                <div class="back-to-login">
                    <br>
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const signupButton = document.getElementById('signupButton');
    const mobileNumberInput = document.getElementById('mobileNumber');
    const passwordInput = document.getElementById('password');

    // Password toggle functionality
    const passwordToggle = document.querySelector('.password-toggle');
    passwordToggle.addEventListener('click', function() {
        const input = this.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Mobile Number Validation
    function validateMobileNumber(number) {
        const mobileRegex = /^[0-9]{10}$/;
        return mobileRegex.test(number);
    }

    // Password Validation
    function validatePassword(password) {
        return password.length >= 6;
    }

    // Login Validation
    function validateLogin() {
        const mobileNumber = mobileNumberInput.value;
        const password = passwordInput.value;

        if (!validateMobileNumber(mobileNumber)) {
            alert('Please enter a valid 10-digit mobile number');
            return false;
        }

        return true;
    }

    signupButton.addEventListener('click', function() {
        alert('Redirecting to Sign Up page');
        // Add your signup page redirection logic here
    });

    // Skip Login Button
    const skipLoginButton = document.getElementById('skipLoginButton');
    skipLoginButton.addEventListener('click', function() {
        // Redirect to a default page or dashboard when skipping login
        window.location.href = 'dashboard.html'; // You might want to create this page
    });

    // Forgot Password Functionality
    const forgetPasswordLink = document.getElementById('forgetPasswordLink');
    const loginContainer = document.querySelector('.login-container');
    const forgetPasswordContainer = document.getElementById('forget-password-container');

    if (forgetPasswordLink && loginContainer && forgetPasswordContainer) {
        forgetPasswordLink.addEventListener('click', function(event) {
            event.preventDefault(); // Prevent default link behavior
            loginContainer.style.display = 'none';
            forgetPasswordContainer.style.display = 'block';
        });
        
    }
});

function showResetContainer() {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('reset-container').style.display = 'block';
}


function resetPassword(event) {
    event.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }

    if (newPassword.length < 8) {
        alert('Password must be at least 8 characters long');
        return;
    }

    // In a real-world scenario, you would:
    // 1. Hash the password
    // 2. Send to backend to update in database
    alert('Password reset successfully!');
    window.location.href = 'login.html';
}
    </script>
</body>
</html>
