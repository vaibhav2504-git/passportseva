<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="container">

        <form id="registrationForm"  method="POST" action="registration.php">
            <h2>Registration Form</h2>

            <div class="name-group">
                <div class="form-group">
              <label for="firstName">First Name</label>
                    <input type="text"  id="firstName" name="first">
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="last">
                </div>
            </div>
            
            <div class="form-group gender-options">
                <label>Gender <br></label>
    
                <div>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="mobileNo">Mobile Number</label>
                <input type="tel" id="mobileNo" name="mobile" pattern="[0-9]{10}">
                <small>Format: 10 digits</small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                <small>Enter a valid email address</small>
            </div>
            
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="pass" minlength="8">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            
            <div class="robot-verification">
                <input type="checkbox" id="notRobot" name="notRobot">
                <label for="notRobot" class="not-robot-label">
                    <div class="checkbox-wrapper"></div>
                    I am not a robot
                </label>
                <span id="verificationStatus" class="verification-status"></span>
            </div>
            
            <input type="submit" value="Submit" name="sb" class="register-btn" disabled>
        </form>
    </div>




    <script >
        document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registrationForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const notRobotInput = document.getElementById('notRobot');
    const submitButton = document.querySelector('.register-btn');
    const verificationStatus = document.getElementById('verificationStatus');

    // Password Validation
    function validatePassword() {
        if (passwordInput.value !== confirmPasswordInput.value) {
            confirmPasswordInput.setCustomValidity("Passwords do not match");
        } else {
            confirmPasswordInput.setCustomValidity("");
        }
    }

    passwordInput.addEventListener('input', validatePassword);
    confirmPasswordInput.addEventListener('input', validatePassword);

    notRobotInput.addEventListener('change', function() {
        if (notRobotInput.checked) {
            verificationStatus.textContent = 'Verified';
            submitButton.disabled = false;
        } else {
            verificationStatus.textContent = 'Not Verified';
            submitButton.disabled = true;
        }
    });
    });
    </script>
</body>
</html>
